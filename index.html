<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RusPredict — рынок прогнозов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="logo" href="#home"><span class="logo-mark">₽</span><span>Rus<b>Predict</b></span></a>
      <nav id="nav" class="nav" aria-label="Разделы">
        <a href="#home" data-r="home">Главная</a>
        <a href="#markets" data-r="markets">Рынки</a>
        <a href="#leaderboard" data-r="leaderboard">Лидеры</a>
        <a href="#account" data-r="account">Аккаунт</a>
      </nav>
      <button class="wallet" id="wallet" title="Пополнить демо-баланс">
        <span id="balance">₽ 10 000</span><i>+</i>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <footer>
    <div class="wrap">RusPredict · демонстрационный прототип. Все средства игровые, вероятности и трейдеры вымышлены. Не является инвестиционной рекомендацией.</div>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" id="close" aria-label="Закрыть">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="events.js"></script>
  <script src="app.js"></script>
</body>
</html>
