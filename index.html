<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RusPredict — рынок прогнозов</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="logo" href="#home"><svg class="logo-svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1b45"/><stop offset="1" stop-color="#1e48c8"/></linearGradient></defs>   <rect width="64" height="64" rx="16" fill="url(#lg1)"/>   <path d="M10 50 22 40l9 4 11-16 9-15" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>   <path d="M23 51V15h12a9.5 9.5 0 0 1 0 19H17M17 41h19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>   <circle cx="51" cy="13" r="6" fill="#d52b1e" stroke="#fff" stroke-width="3"/></svg><span>Rus<b>Predict</b></span></a>
      <nav id="nav" class="nav" aria-label="Разделы">
        <a href="#home" data-r="home">Главная</a>
        <a href="#markets" data-r="markets">Рынки</a>
        <a href="#trade" data-r="trade">Трейдинг</a>
        <a href="#leaderboard" data-r="leaderboard">Лидеры</a>
        <a href="#community" data-r="community">Сообщество</a>
        <a href="#account" data-r="account">Аккаунт</a>
      </nav>
      <button class="wallet" id="wallet" title="Пополнить демо-баланс">
        <span id="balance">₽ 10 000</span><i>+</i>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <footer>
    <div class="wrap">RusPredict · демонстрационный прототип. Все средства игровые, вероятности и трейдеры вымышлены. Не является инвестиционной рекомендацией. <a href="#rules">Правила рынков</a> · <a href="#community">Сообщество и Telegram</a></div>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" id="close" aria-label="Закрыть">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="confirm" class="modal over" hidden>
    <div class="sheet small" role="alertdialog" aria-modal="true" aria-labelledby="c-title">
      <h2 id="c-title"></h2>
      <dl id="c-rows" class="c-rows"></dl>
      <div class="c-actions">
        <button class="sbtn" id="c-no">Отмена</button>
        <button class="pbtn" id="c-yes">Подтвердить</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="events.js"></script>
  <script src="rules.js"></script>
  <script src="news.js"></script>
  <script src="art.js"></script>
  <script src="perps.js"></script>
  <script src="app.js"></script>
</body>
</html>
